<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:image" content="media/01-canvas.png">
  <title>XU Wireflow Review</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #24292f; background: white; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 1080px; margin: auto; padding: 24px clamp(16px, 3vw, 32px) 56px; }
    h1, h2 { line-height: 1.25; }
    h1 { margin: 0; font-size: 1.8rem; }
    h2 { margin: 32px 0 12px; font-size: 1.25rem; }
    p { margin: 8px 0 14px; }
    figure { margin: 0; }
    img, video { display: block; width: 100%; height: auto; }
    img { border: 1px solid #d1d9e0; }
    figcaption { margin-top: 8px; }
    a { color: #1559a1; text-underline-offset: 3px; }
    summary, button { cursor: pointer; }
    summary { margin: 8px 0; }
    textarea { display: block; width: 100%; padding: 8px; font: inherit; }
    button { margin-top: 6px; padding: 3px 10px; font: inherit; }
  </style>
</head>
<body>
<main>
  <h1>XU Wireflow Review</h1>
  <p>바이브 코딩으로 앱을 기획하는 디자이너가 화면을 직접 눌러 보며 빠진 동작과 아직 결정할 일을 찾도록 돕는 스킬입니다.</p>
  <figure>
    <a href="media/01-canvas.png"><img src="media/01-canvas.png" width="1600" height="1000" alt="Night Atlas의 운영 데스크에서 점검 메모 인계까지 여덟 화면을 연결한 와이어플로우"></a>
    <figcaption>전시 운영 앱 Night Atlas의 전체 흐름입니다. 평면도에서 A실을 골라 도면을 확인하고, 다음 교대에 메모를 보내는 경로를 따라가 보세요. <a href="example/night-atlas.html">예제 직접 눌러보기</a></figcaption>
  </figure>
  <details>
    <summary>실제 조작 영상 보기</summary>
    <video controls playsinline preload="none" aria-label="Night Atlas에서 메모를 보내고 검증하는 과정">
      <source src="media/night-atlas.mp4" type="video/mp4">
      <track kind="captions" src="media/night-atlas.ko.vtt" srclang="ko" label="한국어">
    </video>
    <a href="media/night-atlas.ko.vtt">한국어 자막 파일</a>
  </details>
  <h2>흐름을 따라가며 발견한 문제</h2>
  <figure>
    <a href="media/04-review.png"><img src="media/04-review.png" width="1600" height="1000" loading="lazy" alt="‘보낸 메모 재열람’을 선택한 검증 패널과 인계 전송 완료 화면"></a>
    <figcaption>메모는 전송되지만 <strong>‘보낸 메모 다시 열기’</strong>를 누르면 길이 끊깁니다. 재열람은 기획에 있는 동작이고, 별도 인계 기록 화면을 만들지는 디자이너가 정합니다. AI에 복사하는 수정 요청에도 이 구분이 남습니다.</figcaption>
  </figure>
  <h2>내 프로젝트에 적용하기</h2>
  <p id="share-help">프로젝트가 열린 AI 채팅에 전체 배포 키트를 첨부하고 아래 요청을 보내세요.</p>
  <textarea id="prompt" rows="2" readonly aria-label="AI에 보낼 요청">첨부한 배포 키트의 APPLY.md를 읽고 이 스킬을 내 프로젝트에 적용해줘.</textarea>
  <button id="copy" type="button">요청 복사</button>
  <output id="feedback" aria-live="polite"></output>
  <p><a href="APPLY.md">AI용 적용 안내</a> · <a href="wireflow-review-v0.5.1.zip" download>스킬 ZIP</a> · <a href="example/brief.md">예제 기획</a> · <a href="README.md">배포 파일 안내</a> · <a href="SHA256SUMS">체크섬</a></p>
</main>
<script>
  const promptBox = document.querySelector('#prompt');
  const feedback = document.querySelector('#feedback');
  if (['http:', 'https:'].includes(location.protocol)) {
    document.querySelector('#share-help').textContent = '프로젝트가 열린 AI 채팅에 아래 요청을 보내세요.';
    promptBox.value = new URL('APPLY.md', location.href).href + '\n이 스킬을 내 프로젝트에 적용해줘.';
  }
  document.querySelector('#copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(promptBox.value);
      feedback.textContent = '요청을 복사했습니다.';
    } catch {
      promptBox.focus();
      promptBox.select();
      feedback.textContent = '선택된 요청을 복사하세요.';
    }
  });
</script>
</body>
</html>
